name: native

# Builds mono/skia (pinned in native/skia.pin) into a SwiftPM artifact bundle.
# Run manually with "release" checked to publish the bundle as a GitHub release.

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the bundle as a GitHub release
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [native/**, .github/workflows/native.yml]
  pull_request:
    paths: [native/**, .github/workflows/native.yml]

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    # Jammy sets the glibc/libstdc++ baseline the static library is built against.
    container: swift:6.4-jammy
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ninja-build curl ca-certificates libstdc++-12-dev
          git config --global --add safe.directory '*'

      - name: Version
        id: version
        run: |
          pin=$(tr -d '[:space:]' < native/skia.pin)
          echo "tag=skia-${pin:0:12}" >> "$GITHUB_OUTPUT"

      - name: Cache Skia checkout
        uses: actions/cache@v4
        with:
          path: skia-src
          key: skia-src-${{ hashFiles('native/skia.pin') }}

      - name: Build
        run: native/build.sh
        env:
          SKIA_SRC: skia-src
          SKIA_OUT: out/linux-x64

      - name: Smoke test (raster draw + PNG encode, Graphite symbols linked)
        run: |
          clang -std=c11 -O1 native/smoke.c -Iskia-src -Lout/linux-x64 -lSkiaSharp \
            -lstdc++ -lm -lpthread -ldl -o smoke
          ./smoke smoke.png
          test -s smoke.png

      - name: Report unresolved symbols in the whole archive (informational)
        continue-on-error: true
        run: |
          clang -shared -o /tmp/whole.so -Wl,--whole-archive out/linux-x64/libSkiaSharp.a -Wl,--no-whole-archive \
            -lstdc++ -lm -lpthread -ldl -Wl,--no-undefined 2>&1 | grep -o "undefined reference to .*" | sort -u | head -100

      - name: Bundle
        run: |
          python3 native/bundle.py --lib out/linux-x64/libSkiaSharp.a --skia-src skia-src \
            --version "${{ steps.version.outputs.tag }}" --dist dist
          cp smoke.png dist/

      - uses: actions/upload-artifact@v4
        with:
          name: skia-linux-x86_64
          path: |
            dist/skia-linux.artifactbundle.zip
            dist/skia-linux.artifactbundle.zip.sha256
            dist/smoke.png

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skia-linux-x86_64
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.linux-x86_64.outputs.tag }}
        run: |
          checksum=$(cat dist/skia-linux.artifactbundle.zip.sha256)
          notes="mono/skia ${TAG#skia-}, x86_64-unknown-linux-gnu. SwiftPM checksum: \`${checksum}\`"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/skia-linux.artifactbundle.zip dist/skia-linux.artifactbundle.zip.sha256 --clobber
          else
            gh release create "$TAG" dist/skia-linux.artifactbundle.zip dist/skia-linux.artifactbundle.zip.sha256 \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
