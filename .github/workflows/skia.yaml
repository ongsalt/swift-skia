# Builds mono/skia (pinned in native/skia.pin) into SwiftPM artifact bundles:
# one .artifactbundle.zip per target plus an .artifactbundleindex over all of them.
# Runs on changes to native/; skia-release.yaml calls it to publish a release.
name: Build Skia

on:
  workflow_call:
    outputs:
      tag:
        description: "Release tag for this Skia pin (skia-<sha12>)"
        value: ${{ jobs.index.outputs.tag }}
      artifact_id:
        description: "Artifact ID holding every bundle zip and the index"
        value: ${{ jobs.index.outputs.artifact_id }}
  workflow_dispatch:

defaults:
  run:
    shell: bash # container jobs default to sh

jobs:
  build:
    name: build (${{ matrix.target }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # container: Jammy sets the glibc/libstdc++ baseline users need.
          # Leave it empty for runners that build natively (macOS, Windows).
          - platform: ubuntu-24.04
            container: swift:6.4-jammy
            target: linux
            arch: x86_64
          # - platform: ubuntu-24.04-arm
          #   container: swift:6.4-jammy
          #   target: linux
          #   arch: arm64
          - platform: windows-2025
            container: ""
            target: windows
            arch: x86_64

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install prerequisites on Linux
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 ninja-build curl ca-certificates libstdc++-12-dev
          git config --global --add safe.directory '*'

      - name: Set up Python on Windows
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The image ships Visual Studio (MSVC + Windows SDK, found by GN) and LLVM.
      - name: Install prerequisites on Windows
        if: runner.os == 'Windows'
        run: |
          # GN runs its scripts with "python3", which setup-python doesn't provide on Windows.
          py=$(dirname "$(command -v python)")
          [ -e "$py/python3.exe" ] || cp "$py/python.exe" "$py/python3.exe"
          python -m pip install ninja
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          git config --global core.longpaths true

      - name: Version
        id: version
        run: |
          pin=$(tr -d '[:space:]' < native/skia.pin)
          echo "tag=skia-${pin:0:12}" >> "$GITHUB_OUTPUT"

      - name: Cache Skia checkout
        uses: actions/cache@v4
        with:
          path: skia-src
          key: skia-src-${{ runner.os }}-${{ hashFiles('native/skia.pin') }}

      - name: Build Skia for ${{ matrix.target }} (${{ matrix.arch }})
        run: python3 native/build.py ${{ matrix.target }} ${{ matrix.arch }}

      - name: Smoke test (raster draw + PNG encode, Graphite symbols linked)
        if: matrix.target == 'linux'
        run: |
          stage=builds/${{ matrix.target }}-${{ matrix.arch }}
          clang -std=c11 -O1 native/smoke.c -I"$stage" -L"$stage" -lSkiaSharp \
            -lstdc++ -lm -lpthread -ldl -o smoke
          ./smoke "$stage/smoke.png"
          test -s "$stage/smoke.png"

      - name: Check every object in the archive links
        if: matrix.target == 'linux'
        run: |
          if ! clang -shared -o /tmp/whole.so \
              -Wl,--whole-archive builds/${{ matrix.target }}-${{ matrix.arch }}/libSkiaSharp.a -Wl,--no-whole-archive \
              -lstdc++ -lm -lpthread -ldl -Wl,--no-undefined > link.log 2>&1; then
            grep -o "undefined reference to .*" link.log | sort -u | head -100 || cat link.log
            exit 1
          fi

      # System libraries Skia's GN targets list for Windows; users link the same
      # ones (Package.swift). The CRT and C++ runtime come from /MD's defaultlibs.
      # MSYS_NO_PATHCONV keeps Git Bash from rewriting /flags as paths.
      # -fuse-ld=lld: Git Bash's coreutils link.exe can shadow MSVC's.
      - name: Smoke test on Windows (raster draw + PNG encode, Graphite symbols linked)
        if: matrix.target == 'windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          stage=builds/${{ matrix.target }}-${{ matrix.arch }}
          clang-cl /nologo /O1 /MD native/smoke.c /I "$stage" /Fe:smoke.exe -fuse-ld=lld \
            /link "$stage/SkiaSharp.lib" ole32.lib oleaut32.lib user32.lib usp10.lib fontsub.lib gdi32.lib
          ./smoke.exe "$stage/smoke.png"
          test -s "$stage/smoke.png"

      - name: Check every object in the library links on Windows
        if: matrix.target == 'windows'
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          stage=builds/${{ matrix.target }}-${{ matrix.arch }}
          echo 'int skia_link_check;' > whole.c
          if ! clang-cl /nologo /LD /MD whole.c /Fe:whole.dll -fuse-ld=lld \
              /link /NOENTRY "/WHOLEARCHIVE:$stage/SkiaSharp.lib" \
              ole32.lib oleaut32.lib user32.lib usp10.lib fontsub.lib gdi32.lib > link.log 2>&1; then
            grep -o "undefined symbol: .*" link.log | sort -u | head -100 || cat link.log
            exit 1
          fi

      - name: Create artifact bundle
        run: |
          python3 native/bundle.py bundle builds/${{ matrix.target }}-${{ matrix.arch }} \
            --version ${{ steps.version.outputs.tag }} --dist dist

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: skia-bundle-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/
            builds/*/smoke.png
          retention-days: 7

  index:
    needs: [build]
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Version
        id: version
        run: |
          pin=$(tr -d '[:space:]' < native/skia.pin)
          echo "tag=skia-${pin:0:12}" >> "$GITHUB_OUTPUT"

      - name: Download artifact bundles
        uses: actions/download-artifact@v8
        with:
          pattern: skia-bundle-*
          path: all
          merge-multiple: true

      - name: Create artifact bundle index
        run: python3 native/bundle.py index --dist all/dist

      - name: Upload bundles and index
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: skia-bundles
          path: |
            all/dist/*.zip
            all/dist/skia.artifactbundleindex
            all/dist/skia.artifactbundleindex.sha256
          retention-days: 7
